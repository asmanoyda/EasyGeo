{% extends "base.html" %}

{% block title %}
Section Page
{% endblock %}

{% block content %}

<h1 class="text-center mb-4">Sections</h1>

<div class="container mt-3">

    {% if sections %}

    <div class="row">

        {% for section in sections %}

        <!-- 2 cards side by side on all screen sizes except very small -->
        <div class="col-12 mb-4">

            <button type="button" class="btn btn-primary w-100" data-bs-toggle="collapse"
                data-bs-target="#section{{ section.id }}">

                {{ section.section_name }}

            </button>

            <div id="section{{ section.id }}" class="collapse border p-3 mt-2 rounded">

                <a href="{% url 'unit' section.id %}" class="btn btn-success">
                    Go to Unit Page
                </a>

            </div>

        </div>

        {% endfor %}

    </div>

    {% else %}

    <p>Sorry, no records found.</p>

    {% endif %}

</div>

{% endblock %}
