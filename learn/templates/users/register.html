{% extends "mypage/base.html" %}

{% block title %}
Registration
{% endblock %}

{% block content %}
<br>
<br>
<div class="container d-flex justify-content-center align-items-center" style="min-height: 85vh;">

    <div  class="card login-card shadow-lg border-0 p-4" style="width: 500px;">

        <h2 class="text-center mb-4 h2-color">Create Account</h2>

        {% for message in messages %}
        <div class="alert alert-warning">
            {{ message }}
        </div>
        {% endfor %}

        <form action="registration" method="POST" class="p-4 rounded">
            {% csrf_token %}

            <div class="mb-3">
                <label>Name:</label>
                <input type="text" class="form-control" name="name" required>
            </div>

            <div class="mb-3">
                <label>Username:</label>
                <input type="text" class="form-control" name="username" required>
            </div>

            <div class="mb-3">
                <label>Email:</label>
                <input type="email" class="form-control" name="email" required>
            </div>

            <div class="mb-3">
                <label>Mobile No:</label>
                <input type="text" class="form-control" name="mobile_no" required>
            </div>

            <div class="mb-3">
                <label>Password:</label>
                <input type="password" class="form-control" name="password" required>
            </div>

            <div class="mb-3">
                <label>Confirm Password:</label>
                <input type="password" class="form-control" name="confirm_password" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 course-btn">
                Sign Up
            </button>

            <div class="text-center mt-3">
                Already have an account?
                <a href="{% url 'users:login' %}">Login</a>
            </div>

        </form>

    </div>

</div>

{% endblock %}
