<header>
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container-fluid">


            <!-- Navbar Toggler -->
            <a class="navbar-brand fw-bold fs-3" href="#">
                🌍 EasyGeo
            </a>

                    </li>

                    <li class="nav-item mx-2">

                    </form>

                                <li>

                                    <a class="nav-link " href="{% url 'users:login' %}">
